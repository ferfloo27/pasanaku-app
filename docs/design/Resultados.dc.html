<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Resultados del sorteo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#8B1E2F}a:hover{color:#5C1220}button{font-family:inherit}</style>
</helmet>
<div style="width: 360px; height: 1100px; box-sizing: border-box; background: #FBF3EC; color: #2C2C2A; font-family: Nunito, Poppins, system-ui, sans-serif; display: flex; flex-direction: column;">
  <svg width="100%" height="12" aria-hidden="true" style="display: block; flex-shrink: 0;"><defs><pattern id="xC" width="16" height="12" patternUnits="userSpaceOnUse"><rect width="16" height="12" fill="#D9A441"></rect><path d="M0 12V9H2V6H4V3H6V0H10V3H12V6H14V9H16V12Z" fill="#8B1E2F"></path><rect x="7" y="4" width="2" height="2" fill="#F6DDE2"></rect><rect x="7" y="8" width="2" height="4" fill="#B5475A"></rect></pattern></defs><rect width="100%" height="12" fill="url(#xC)"></rect></svg>
  <header style="padding: 8px 8px 0; display: flex; align-items: center; gap: 4px;">
    <a href="Inicio.dc.html" aria-label="Volver al inicio" style="width: 44px; height: 44px; border-radius: 999px; color: #2C2C2A; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg></a>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
      <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700;">Pasanaku Familia Mamani</h1>
      <div style="display: flex; gap: 8px; align-items: center; margin-top: 2px;">
        <span style="display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; background: #E3F1E4; color: #27500A; font-size: 13px; font-weight: 700;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Sorteada</span>
        <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.2em; color: #6E5A55;">K7QM3P</span>
      </div>
    </div>
  </header>

  <div style="margin: 16px 16px 0; padding: 18px 16px; border-radius: 18px; background: #8B1E2F; color: #FFFFFF; display: flex; align-items: center; gap: 14px;">
    <span style="width: 56px; height: 56px; border-radius: 999px; background: #FFFFFF; color: #8B1E2F; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; flex-shrink: 0;">3</span>
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 13px; font-weight: 700; color: #F6DDE2;">Tu turno</span>
      <b style="font-size: 22px; line-height: 28px;">Marzo 2027</b>
      <span style="font-size: 13px; color: #F6DDE2;">Recibes Bs 1.600</span>
    </div>
  </div>

  <dl style="margin: 12px 16px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
    <div style="padding: 10px 12px; border: 1px solid #E8DCD2; border-radius: 14px; background: #FFFFFF;"><dt style="font-size: 13px; color: #6E5A55;">Cuota</dt><dd style="margin: 2px 0 0; font-size: 15px; font-weight: 700;">Bs 200</dd></div>
    <div style="padding: 10px 12px; border: 1px solid #E8DCD2; border-radius: 14px; background: #FFFFFF;"><dt style="font-size: 13px; color: #6E5A55;">Frecuencia</dt><dd style="margin: 2px 0 0; font-size: 15px; font-weight: 700;">Mensual</dd></div>
    <div style="padding: 10px 12px; border: 1px solid #E8DCD2; border-radius: 14px; background: #FFFFFF;"><dt style="font-size: 13px; color: #6E5A55;">Por turno</dt><dd style="margin: 2px 0 0; font-size: 15px; font-weight: 700;">Bs 1.600</dd></div>
  </dl>

  <section style="padding: 24px 16px 0; display: flex; flex-direction: column; gap: 10px;">
    <h2 style="margin: 0; font-size: 17px; line-height: 24px; font-weight: 700;">Orden de cobro</h2>
    <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px;">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
        <li style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 18px; {{r.rowStyle}}">
          <span style="width: 32px; height: 32px; border-radius: 999px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; flex-shrink: 0; {{r.posStyle}}">{{r.pos}}</span>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column;"><b style="font-size: 15px; line-height: 20px;">{{r.name}}</b><span style="font-size: 13px; color: {{r.sub}};">{{r.date}}</span></div>
          <b style="font-size: 15px;">Bs 1.600</b>
        </li>
      </sc-for>
    </ol>
  </section>
  <div style="flex: 1;"></div>
  <div style="padding: 20px 16px 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
    <button type="button" style="height: 48px; border: 1.5px solid #8B1E2F; border-radius: 999px; background: #FFFFFF; color: #8B1E2F; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>Copiar resultados</button>
    <button type="button" style="height: 48px; border: none; border-radius: 999px; background: #8B1E2F; color: #FFFFFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="m8.6 13.5 6.8 4"></path><path d="m15.4 6.5-6.8 4"></path></svg>Compartir</button>
  </div>
  <svg width="100%" height="12" aria-hidden="true" style="display: block; flex-shrink: 0;"><rect width="100%" height="12" fill="url(#xC)"></rect></svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const names = ['Carmen Choque', 'Luis Condori', 'Lucía Mamani', 'Juan Quispe', 'Sofía Limachi', 'Pedro Huanca', 'Ana Flores', 'Marco Apaza'];
    const months = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto'];
    return {
      rows: names.map((n, i) => {
        const me = i === 2;
        return {
          pos: i + 1,
          name: me ? n + ' · Tú' : n,
          date: months[i] + ' 2027',
          sub: me ? '#5C1220' : '#6E5A55',
          rowStyle: me ? 'background: #F6DDE2; border: 1.5px solid #E9B5C0; color: #5C1220;' : 'background: #FFFFFF; border: 1px solid #E8DCD2;',
          posStyle: me ? 'background: #8B1E2F; color: #FFFFFF;' : 'background: #FBF3EC; border: 1px solid #E8DCD2; color: #8B1E2F;'
        };
      })
    };
  }
}
</script>
</body>
</html>
