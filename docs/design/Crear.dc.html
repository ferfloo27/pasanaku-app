<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Crear sala</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#8B1E2F}a:hover{color:#5C1220}button,input,select{font-family:inherit}</style>
</helmet>
<div style="width: 360px; height: 1000px; box-sizing: border-box; background: #FBF3EC; color: #2C2C2A; font-family: Nunito, Poppins, system-ui, sans-serif; display: flex; flex-direction: column;">
  <header style="padding: 12px 8px 4px; display: flex; align-items: center; gap: 4px;">
    <a href="Inicio.dc.html" aria-label="Volver al inicio" style="width: 44px; height: 44px; border-radius: 999px; color: #2C2C2A; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg></a>
    <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700;">Crear sala</h1>
  </header>
  <form style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 20px;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="n" style="font-size: 15px; font-weight: 700;">Nombre de la sala</label>
      <input id="n" type="text" value="Pasanaku Familia Mamani" style="height: 48px; box-sizing: border-box; border: 1px solid #D9C8BE; border-radius: 12px; padding: 0 14px; font-size: 15px; color: #2C2C2A; background: #FFFFFF;">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="q" style="font-size: 15px; font-weight: 700;">Cuota por persona</label>
      <div style="height: 48px; box-sizing: border-box; border: 1.5px solid #8B1E2F; border-radius: 12px; display: flex; align-items: center; background: #FFFFFF; overflow: hidden; outline: 2px solid #B5475A; outline-offset: 2px;">
        <span style="padding: 0 12px; height: 100%; display: flex; align-items: center; font-weight: 700; color: #6E5A55; background: #FBF3EC; border-right: 1px solid #E8DCD2;">Bs</span>
        <input id="q" type="text" inputmode="numeric" value="200" style="flex: 1; min-width: 0; height: 100%; border: none; padding: 0 12px; font-size: 15px; background: transparent; color: #2C2C2A; outline: none;">
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span id="fq" style="font-size: 15px; font-weight: 700;">Frecuencia</span>
      <div role="radiogroup" aria-labelledby="fq" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #FFFFFF; border: 1px solid #E8DCD2; border-radius: 999px;">
        <button type="button" role="radio" aria-checked="false" style="height: 40px; border: none; border-radius: 999px; background: transparent; color: #6E5A55; font-size: 15px; font-weight: 700;">Semanal</button>
        <button type="button" role="radio" aria-checked="false" style="height: 40px; border: none; border-radius: 999px; background: transparent; color: #6E5A55; font-size: 15px; font-weight: 700;">Quincenal</button>
        <button type="button" role="radio" aria-checked="true" style="height: 40px; border: none; border-radius: 999px; background: #8B1E2F; color: #FFFFFF; font-size: 15px; font-weight: 700;">Mensual</button>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="d" style="font-size: 15px; font-weight: 700;">Fecha de inicio</label>
      <div style="height: 48px; box-sizing: border-box; border: 1px solid #D9C8BE; border-radius: 12px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: #FFFFFF;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6E5A55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4"></path><path d="M8 2v4"></path><path d="M3 10h18"></path></svg>
        <select id="d" style="flex: 1; border: none; background: transparent; font-size: 15px; color: #2C2C2A;"><option>Enero 2027</option><option>Febrero 2027</option><option>Marzo 2027</option></select>
      </div>
      <span style="font-size: 13px; color: #6E5A55;">Mensual: eliges mes y año. Semanal o quincenal: eliges el día.</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="m" style="font-size: 15px; font-weight: 700;">Máx. participantes</label>
      <input id="m" type="text" inputmode="numeric" value="30" style="height: 48px; box-sizing: border-box; border: 1px solid #D9C8BE; border-radius: 12px; padding: 0 14px; font-size: 15px; color: #2C2C2A; background: #FFFFFF;">
      <span style="font-size: 13px; color: #6E5A55;">Entre 2 y 30.</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px; padding: 16px; border: 1.5px solid #E9B5C0; border-radius: 18px; background: #F6DDE2; color: #5C1220;">
      <span style="font-size: 13px; font-weight: 700;">Resumen</span>
      <span style="font-size: 17px; line-height: 24px; font-weight: 700;">Cada turno recibe Bs 200 × participantes</span>
      <span style="font-size: 13px; line-height: 18px;">Con 10 personas: Bs 2.000 por turno, un turno al mes desde Enero 2027.</span>
    </div>
  </form>
  <div style="flex: 1;"></div>
  <div style="padding: 16px; border-top: 1px solid #E8DCD2; background: #FBF3EC;">
    <a href="SalaLista.dc.html" style="height: 52px; border-radius: 999px; background: #8B1E2F; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center;">Crear sala</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":1000}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
