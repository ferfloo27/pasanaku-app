<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lobby · participante</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#8B1E2F}a:hover{color:#5C1220}button{font-family:inherit}
@keyframes pk-dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
.pk-d{animation:pk-dot 1.4s infinite both}.pk-d2{animation-delay:.2s}.pk-d3{animation-delay:.4s}
@media (prefers-reduced-motion: reduce){.pk-d{animation:none;opacity:.7}}</style>
</helmet>
<div style="width: 360px; height: 1000px; box-sizing: border-box; background: #FBF3EC; color: #2C2C2A; font-family: Nunito, Poppins, system-ui, sans-serif; display: flex; flex-direction: column;">
  <svg width="100%" height="8" aria-hidden="true" style="display: block; flex-shrink: 0;"><defs><pattern id="qA" width="16" height="8" patternUnits="userSpaceOnUse"><rect width="16" height="8" fill="#8B1E2F"></rect><path d="M8 0.5L12 4L8 7.5L4 4Z" fill="#D9A441"></path><path d="M8 2.5L9.5 4L8 5.5L6.5 4Z" fill="#8B1E2F"></path><path d="M0 0L2 4L0 8Z" fill="#B5475A"></path><path d="M16 0L14 4L16 8Z" fill="#B5475A"></path></pattern></defs><rect width="100%" height="8" fill="url(#qA)"></rect></svg>
  <header style="padding: 8px 8px 0; display: flex; align-items: center; gap: 4px;">
    <a href="Inicio.dc.html" aria-label="Volver al inicio" style="width: 44px; height: 44px; border-radius: 999px; color: #2C2C2A; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg></a>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
      <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700;">Tanda de la oficina</h1>
      <span style="display: inline-flex; align-self: flex-start; align-items: center; height: 22px; padding: 0 8px; margin-top: 2px; border-radius: 999px; background: #FAEEDA; color: #633806; font-size: 13px; font-weight: 700;">En espera</span>
    </div>
  </header>

  <div role="status" style="margin: 16px 16px 0; padding: 16px; border: 1.5px solid #E9B5C0; border-radius: 18px; background: #F6DDE2; color: #5C1220; display: flex; gap: 12px; align-items: center;">
    <span aria-hidden="true" style="display: flex; gap: 4px; flex-shrink: 0;"><i class="pk-d" style="width: 8px; height: 8px; border-radius: 999px; background: #8B1E2F;"></i><i class="pk-d pk-d2" style="width: 8px; height: 8px; border-radius: 999px; background: #8B1E2F;"></i><i class="pk-d pk-d3" style="width: 8px; height: 8px; border-radius: 999px; background: #8B1E2F;"></i></span>
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <b style="font-size: 15px; line-height: 22px;">Esperando a que Rosa haga el sorteo</b>
      <span style="font-size: 13px; line-height: 18px;">Cuando lo anuncie, verás la revelación aquí mismo.</span>
    </div>
  </div>

  <div style="margin: 12px 16px 0; border: 1px solid #E8DCD2; border-radius: 18px; overflow: hidden; background: #FFFFFF;">
    <svg width="100%" height="8" aria-hidden="true" style="display: block;"><defs><pattern id="qB" width="6" height="8" patternUnits="userSpaceOnUse"><rect width="6" height="8" fill="#8B1E2F"></rect><rect y="1" width="6" height="1" fill="#D9A441"></rect><rect y="2" width="6" height="4" fill="#B5475A"></rect><path d="M0 6L3 2L6 6Z" fill="#F6DDE2"></path><rect y="6" width="6" height="1" fill="#D9A441"></rect></pattern></defs><rect width="100%" height="8" fill="url(#qB)"></rect></svg>
    <div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 13px; color: #6E5A55;">Código</span>
        <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 24px; line-height: 28px; font-weight: 700; letter-spacing: 0.2em; color: #8B1E2F;">R2XH9D</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
        <button type="button" style="height: 44px; border: 1.5px solid #8B1E2F; border-radius: 999px; background: #FFFFFF; color: #8B1E2F; font-size: 15px; font-weight: 700;">Copiar código</button>
        <button type="button" style="height: 44px; border: 1.5px solid #8B1E2F; border-radius: 999px; background: #FFFFFF; color: #8B1E2F; font-size: 15px; font-weight: 700;">Compartir link</button>
      </div>
    </div>
  </div>

  <dl style="margin: 12px 16px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
    <div style="padding: 10px 12px; border: 1px solid #E8DCD2; border-radius: 14px; background: #FFFFFF;"><dt style="font-size: 13px; color: #6E5A55;">Cuota</dt><dd style="margin: 2px 0 0; font-size: 15px; font-weight: 700;">Bs 150</dd></div>
    <div style="padding: 10px 12px; border: 1px solid #E8DCD2; border-radius: 14px; background: #FFFFFF;"><dt style="font-size: 13px; color: #6E5A55;">Frecuencia</dt><dd style="margin: 2px 0 0; font-size: 15px; font-weight: 700;">Quincenal</dd></div>
    <div style="padding: 10px 12px; border: 1px solid #E8DCD2; border-radius: 14px; background: #FFFFFF;"><dt style="font-size: 13px; color: #6E5A55;">Inicio</dt><dd style="margin: 2px 0 0; font-size: 15px; font-weight: 700;">15 ene 2027</dd></div>
  </dl>

  <section style="padding: 24px 16px 24px; display: flex; flex-direction: column; gap: 10px;">
    <h2 style="margin: 0; font-size: 17px; line-height: 24px; font-weight: 700;">Participantes (8/15)</h2>
    <ul aria-live="polite" style="margin: 0; padding: 0; list-style: none; border: 1px solid #E8DCD2; border-radius: 18px; background: #FFFFFF; overflow: hidden;">
      <sc-for list="{{people}}" as="p" hint-placeholder-count="8">
        <li style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; min-height: 44px; box-sizing: border-box; border-bottom: 1px solid #E8DCD2;">
          <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; {{p.avatar}}">{{p.ini}}</span>
          <span style="flex: 1; font-size: 15px; font-weight: 700;">{{p.name}}</span>
          <sc-if value="{{p.host}}" hint-placeholder-val="{{false}}"><span style="display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; background: #F6DDE2; color: #5C1220; font-size: 13px; font-weight: 700;">Anfitrión</span></sc-if>
          <sc-if value="{{p.me}}" hint-placeholder-val="{{false}}"><span style="display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; border: 1.5px solid #8B1E2F; color: #8B1E2F; font-size: 13px; font-weight: 700; box-sizing: border-box;">Tú</span></sc-if>
        </li>
      </sc-for>
    </ul>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [['Rosa Mamani', 'host'], ['Lucía Mamani', 'me'], ['Germán Rojas'], ['Patricia Vargas'], ['Diego Mendoza'], ['Valeria Torrez'], ['Ronald Gutiérrez'], ['Silvia Cruz']];
    return {
      people: list.map(([n, r]) => ({
        name: n,
        ini: n.split(' ').map((w) => w[0]).join(''),
        host: r === 'host',
        me: r === 'me',
        avatar: r === 'host' ? 'background: #8B1E2F; color: #FFFFFF;' : 'background: #F6DDE2; color: #5C1220;'
      }))
    };
  }
}
</script>
</body>
</html>
