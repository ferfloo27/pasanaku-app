<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lobby · anfitrión</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#8B1E2F}a:hover{color:#5C1220}button{font-family:inherit}
@keyframes pk-in{from{opacity:0;transform:translateY(-6px);background:#F6DDE2}to{opacity:1;transform:none}}
.pk-new{animation:pk-in .6s ease-out both}
@media (prefers-reduced-motion: reduce){.pk-new{animation:none}}</style>
</helmet>
<div style="width: 360px; height: 1100px; box-sizing: border-box; background: #FBF3EC; color: #2C2C2A; font-family: Nunito, Poppins, system-ui, sans-serif; display: flex; flex-direction: column;">
  <svg width="100%" height="8" aria-hidden="true" style="display: block; flex-shrink: 0;"><defs><pattern id="lA" width="16" height="8" patternUnits="userSpaceOnUse"><rect width="16" height="8" fill="#8B1E2F"></rect><path d="M8 0.5L12 4L8 7.5L4 4Z" fill="#D9A441"></path><path d="M8 2.5L9.5 4L8 5.5L6.5 4Z" fill="#8B1E2F"></path><path d="M0 0L2 4L0 8Z" fill="#B5475A"></path><path d="M16 0L14 4L16 8Z" fill="#B5475A"></path></pattern></defs><rect width="100%" height="8" fill="url(#lA)"></rect></svg>
  <header style="padding: 8px 8px 0; display: flex; align-items: center; gap: 4px;">
    <a href="Inicio.dc.html" aria-label="Volver al inicio" style="width: 44px; height: 44px; border-radius: 999px; color: #2C2C2A; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg></a>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
      <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700;">Pasanaku Familia Mamani</h1>
      <span style="display: inline-flex; align-self: flex-start; align-items: center; height: 22px; padding: 0 8px; margin-top: 2px; border-radius: 999px; background: #FAEEDA; color: #633806; font-size: 13px; font-weight: 700;">En espera</span>
    </div>
    <a href="LobbyEspera.dc.html" aria-label="Más acciones de la sala" style="width: 44px; height: 44px; border-radius: 999px; color: #2C2C2A; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="5" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle></svg></a>
  </header>

  <div style="margin: 16px 16px 0; border: 1px solid #E8DCD2; border-radius: 18px; overflow: hidden; background: #FFFFFF;">
    <svg width="100%" height="8" aria-hidden="true" style="display: block;"><defs><pattern id="lB" width="6" height="8" patternUnits="userSpaceOnUse"><rect width="6" height="8" fill="#8B1E2F"></rect><rect y="1" width="6" height="1" fill="#D9A441"></rect><rect y="2" width="6" height="4" fill="#B5475A"></rect><path d="M0 6L3 2L6 6Z" fill="#F6DDE2"></path><rect y="6" width="6" height="1" fill="#D9A441"></rect></pattern></defs><rect width="100%" height="8" fill="url(#lB)"></rect></svg>
    <div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 13px; color: #6E5A55;">Código</span>
        <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 24px; line-height: 28px; font-weight: 700; letter-spacing: 0.2em; color: #8B1E2F;">K7QM3P</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
        <button type="button" style="height: 44px; border: 1.5px solid #8B1E2F; border-radius: 999px; background: #FFFFFF; color: #8B1E2F; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>Copiar código</button>
        <button type="button" style="height: 44px; border: 1.5px solid #8B1E2F; border-radius: 999px; background: #FFFFFF; color: #8B1E2F; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="m8.6 13.5 6.8 4"></path><path d="m15.4 6.5-6.8 4"></path></svg>Compartir link</button>
      </div>
    </div>
  </div>

  <dl style="margin: 12px 16px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
    <div style="padding: 10px 12px; border: 1px solid #E8DCD2; border-radius: 14px; background: #FFFFFF;"><dt style="font-size: 13px; color: #6E5A55;">Cuota</dt><dd style="margin: 2px 0 0; font-size: 15px; font-weight: 700;">Bs 200</dd></div>
    <div style="padding: 10px 12px; border: 1px solid #E8DCD2; border-radius: 14px; background: #FFFFFF;"><dt style="font-size: 13px; color: #6E5A55;">Frecuencia</dt><dd style="margin: 2px 0 0; font-size: 15px; font-weight: 700;">Mensual</dd></div>
    <div style="padding: 10px 12px; border: 1px solid #E8DCD2; border-radius: 14px; background: #FFFFFF;"><dt style="font-size: 13px; color: #6E5A55;">Inicio</dt><dd style="margin: 2px 0 0; font-size: 15px; font-weight: 700;">Ene 2027</dd></div>
  </dl>

  <section style="padding: 24px 16px 0; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <h2 style="margin: 0; font-size: 17px; line-height: 24px; font-weight: 700;">Participantes (8/30)</h2>
      <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #27500A; font-weight: 700;"><i aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: #27500A;"></i>En vivo</span>
    </div>
    <ul aria-live="polite" style="margin: 0; padding: 0; list-style: none; border: 1px solid #E8DCD2; border-radius: 18px; background: #FFFFFF; overflow: hidden;">
      <li style="display: flex; align-items: center; gap: 12px; padding: 10px 8px 10px 14px; min-height: 44px; border-bottom: 1px solid #E8DCD2;">
        <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 999px; background: #8B1E2F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0;">LM</span>
        <span style="flex: 1; font-size: 15px; font-weight: 700;">Lucía Mamani</span>
        <span style="display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; background: #F6DDE2; color: #5C1220; font-size: 13px; font-weight: 700;">Anfitrión</span>
        <span style="display: inline-flex; align-items: center; height: 24px; padding: 0 10px; margin-right: 6px; border-radius: 999px; border: 1.5px solid #8B1E2F; color: #8B1E2F; font-size: 13px; font-weight: 700; box-sizing: border-box;">Tú</span>
      </li>
      <sc-for list="{{people}}" as="p" hint-placeholder-count="7">
        <li class="{{p.cls}}" style="display: flex; align-items: center; gap: 12px; padding: 4px 4px 4px 14px; border-bottom: 1px solid #E8DCD2;">
          <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 999px; background: #F6DDE2; color: #5C1220; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0;">{{p.ini}}</span>
          <div style="flex: 1; display: flex; flex-direction: column; min-width: 0;"><span style="font-size: 15px; font-weight: 700;">{{p.name}}</span><span style="font-size: 13px; color: #27500A;">{{p.note}}</span></div>
          <a href="EliminarParticipante.dc.html" aria-label="Eliminar a {{p.name}}" style="width: 44px; height: 44px; border-radius: 999px; color: #6E5A55; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg></a>
        </li>
      </sc-for>
    </ul>
  </section>
  <div style="flex: 1;"></div>
  <div style="padding: 16px; border-top: 1px solid #E8DCD2; display: flex; flex-direction: column; gap: 8px;">
    <a href="Borrador.dc.html" style="height: 52px; border-radius: 999px; background: #8B1E2F; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"></path><path d="m18 2 4 4-4 4"></path><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"></path><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"></path><path d="m18 14 4 4-4 4"></path></svg>Sortear orden</a>
    <p style="margin: 0; text-align: center; font-size: 13px; line-height: 18px; color: #6E5A55;">Primero verás un borrador que solo tú puedes ver.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const names = ['Juan Quispe', 'Carmen Choque', 'Luis Condori', 'Ana Flores', 'Pedro Huanca', 'Sofía Limachi', 'Marco Apaza'];
    return {
      people: names.map((n, i) => {
        const isNew = i === names.length - 1;
        return { name: n, ini: n.split(' ').map((w) => w[0]).join(''), note: isNew ? 'Acaba de entrar' : '', cls: isNew ? 'pk-new' : '' };
      })
    };
  }
}
</script>
</body>
</html>
